<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171719" />
  <meta name="description" content="나인웍스 공유 일정표" />
  <title>NINEWORKS — 공유 캘린더</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="share-header">
    <div class="share-header__inner">
      <img src="../assets/nineworks-logo.svg" alt="NINEWORKS" class="share-logo" />
      <span>SHARED CALENDAR</span>
    </div>
  </header>

  <main class="share-main">
    <section class="share-heading">
      <div>
        <p class="eyebrow">WORK SCHEDULE</p>
        <h1>나인웍스 일정 공유</h1>
        <p>현재 진행 중인 작업과 예정된 일정을 확인할 수 있습니다.</p>
      </div>
      <div class="share-status">
        <span id="updatedAt">일정 불러오는 중</span>
        <span class="live-dot"></span>
        <span>실시간 업데이트</span>
      </div>
    </section>

    <section class="share-toolbar" aria-label="일정 필터">
      <label>
        <span>클라이언트</span>
        <select id="clientFilter">
          <option value="all">전체 클라이언트</option>
        </select>
      </label>
      <div class="share-legend">
        <span><i class="dot dot--planned"></i>예정</span>
        <span><i class="dot dot--progress"></i>진행 중</span>
        <span><i class="dot dot--review"></i>검수 중</span>
        <span><i class="dot dot--done"></i>완료</span>
      </div>
    </section>

    <section class="calendar-panel">
      <div id="calendar"></div>
      <div id="emptyState" class="empty-state" hidden>공유된 일정이 없습니다.</div>
    </section>

    <footer class="share-footer">
      <span>NINEWORKS · INTERNAL WORKFLOW</span>
      <span>읽기 전용 일정표</span>
    </footer>
  </main>
</body>
</html>
