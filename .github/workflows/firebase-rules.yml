name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_NINEWORKS_CRM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NINEWORKS_CRM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase credential
        id: firebase_credential
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_NINEWORKS_CRM" ] || [ -n "$FIREBASE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Firebase deployment credential is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Firebase deployment credential is not configured yet. Rules deployment is skipped safely."
          fi

      - name: Configure Firebase service account
        if: ${{ steps.firebase_credential.outputs.available == 'true' && env.FIREBASE_SERVICE_ACCOUNT_NINEWORKS_CRM != '' }}
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_NINEWORKS_CRM" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        if: ${{ steps.firebase_credential.outputs.available == 'true' }}
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_NINEWORKS_CRM" ]; then
            npx --yes firebase-tools@latest deploy --only firestore:rules --project nineworks-crm --non-interactive
          else
            npx --yes firebase-tools@latest deploy --only firestore:rules --project nineworks-crm --non-interactive --token "$FIREBASE_TOKEN"
          fi
